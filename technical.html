<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Festival Management - Technical</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>MUSIC FESTIVAL MANAGEMENT</h1>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="artists.html">Artists</a>
      <a href="stage.html">Stage</a>

      <a href="technical.html" class="active">Technical</a>

    <div class="box">
      <h3>Add Technical Item</h3>
      <label>Item Name:</label>
      <input type="text" id="techName" placeholder="e.g. Mic">

      <p id="msgTech" class="msg"></p>

    <div class="box table-box">
      <h3>Technical Gear</h3>
      <table>
        <thead>
          <tr><th>No.</th><th>Item</th><th>Action</th></tr>
        </thead>
        <tbody id="techTable"></tbody>
      </table>
    </div>
  </div>
  <script src="script.js"></script>
  <script>renderTech();</script>
